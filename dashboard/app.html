<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>SEO Admin</title>
    <link rel="stylesheet" href="css/app.css">
    <link rel="icon" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@latest/favicon-32x32.png">
</head>

<body>

    <div class="layout">

        <aside class="sidebar">
            <div class="brand">SEO Admin</div>
            <nav>
                <button data-view="overview">Overview</button>
                <button data-view="sites">Sites</button>
                <button data-view="health">Health</button>
            </nav>
        </aside>

        <div class="main">
            <header class="topbar">
                <div id="pageTitle"></div>
                <button class="primary-btn" id="logoutBtn">Logout</button>
            </header>

            <section id="metricsBar"></section>

            <section id="content"></section>
        </div>

    </div>

    <div id="modalContainer"></div>
    <div id="toastContainer"></div>

    <script src="js/api.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/router.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
